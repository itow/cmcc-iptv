name: Update EPG

on:
  schedule:
    # 每 4 小时执行一次 (UTC 00:00, 04:00, 08:00, 12:00, 16:00, 20:00)
    - cron: '0 */4 * * *'
  push:
    paths:
      - 'tv.m3u'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: Run EPG Aggregator
        env:
          EPG_SOURCES: ${{ vars.EPG_SOURCES }}
        run: |
          python3 scripts/process_epg.py

      # 将根目录的 tv.m3u 一并复制到 dist 目录对外发布
      - name: Copy tv.m3u to dist
        run: |
          if [ -f "tv.m3u" ]; then
            cp tv.m3u dist/tv.m3u
            echo "Successfully copied tv.m3u to dist/"
            echo "OK" > dist/index.html
          fi

      - name: Deploy to gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Automated update EPG & M3U: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
