name: Update EPG

on:
  schedule:
    # 每 4 小时执行一次 (UTC 00:00, 04:00, 08:00, 12:00, 16:00, 20:00)
    - cron: '0 */4 * * *'
  push:
    paths:
      - 'tv.m3u'
  workflow_dispatch:

jobs:
  build:
    # 显式指定 ubuntu-24.04，消除 ubuntu-latest 迁移通知
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # 原生拉取代码，不使用 actions/checkout，彻底消除 Node 20 废弃警告
      - name: Checkout repository
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      # 直接调用 Ubuntu 镜像系统自带的 Python 3（无需 actions/setup-python）
      - name: Run EPG Aggregator
        env:
          EPG_SOURCES: ${{ vars.EPG_SOURCES }}
        run: |
          python3 scripts/process_epg.py

      # 原生 Git 推送至 gh-pages 分支
      - name: Deploy to gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Automated update EPG: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
