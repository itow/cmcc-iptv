name: Update EPG

on:
  schedule:
    # 每 4 小时执行一次 (UTC 00:00, 04:00, 08:00, 12:00, 16:00, 20:00)
    - cron: '0 */4 * * *'
  push:
    paths:
      - 'tv.m3u'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须具备写入仓库权限以推送到 gh-pages 分支

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run EPG Aggregator
        env:
          EPG_SOURCES: ${{ vars.EPG_SOURCES }}
        run: |
          python scripts/process_epg.py

      # 原生 Git 推送至 gh-pages 分支，零第三方依赖，彻底避免 Node.js 废弃警告
      - name: Deploy to gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Automated update EPG: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages
