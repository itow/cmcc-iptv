name: Update EPG

on:
  schedule:
    # 每 4 小时执行一次 (UTC 00:00, 04:00, 08:00, 12:00, 16:00, 20:00)
    - cron: '0 */4 * * *'
  # 当你修改了 tv.m3u 并 push 时，也会自动触发更新一次
  push:
    paths:
      - 'tv.m3u'
  workflow_dispatch: # 支持在 GitHub 网页手动一键点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 自动推送到 gh-pages 分支的权限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run EPG Aggregator
        env:
          # 仅需配置 EPG 上游源列表
          EPG_SOURCES: ${{ vars.EPG_SOURCES }}
        run: |
          python scripts/process_epg.py

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
